name: sippol

services:
  mysql:
    image: mysql:8.0
    container_name: sippol-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env.backend
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-sippol}"
      MYSQL_USER: "${DB_USERNAME:-sippol_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-sippol_secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-sippol_secret}}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sippol-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-$${DB_PASSWORD:-sippol_secret}} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/mardanaputra/sippol-backend:latest
    build:
      context: ../sippol-backend
      dockerfile: Dockerfile
    container_name: sippol-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.backend
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    networks:
      - sippol-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/mardanaputra/sippol-frontend:latest
    build:
      context: ../sippol-frontend
      dockerfile: Dockerfile
    container_name: sippol-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sippol-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
    name: sippol_mysql_data
  backend_storage:
    name: sippol_backend_storage

networks:
  sippol-network:
    name: sippol-network
    driver: bridge
